name: Build Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - '*'
  workflow_dispatch:
    inputs:
      client:
        description: 'Which client to build (leave empty to build both)'
        required: false
        type: choice
        options:
          - ''
          - client-js
          - client-react

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
    - name: Set up Node.js
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version: '24'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
        
    - name: Configure Git
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'github-actions@github.com'
        
    - name: Install dependencies
      run: npm install
      
    - name: Build specific client
      if: github.event.inputs.client != ''
      run: |
        cd ${{ github.event.inputs.client }}
        npm run build
        
    - name: Build all clients
      if: github.event.inputs.client == '' || github.event.inputs.client == null
      run: npm run build
