name: Release Please

on:
  push:
    branches:
      - main
  # Manual re-run: refreshes the open release PRs and re-curates their notes,
  # e.g. after editing a merged feature PR's "## Release Notes" section.
  workflow_dispatch:

# Two quick pushes to main would otherwise race: one run's curate push can be
# rejected after the other run force-pushes the release branch.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.release.outputs.releases_created }}
      js_release_created: ${{ steps.release.outputs['client-js--release_created'] }}
      react_release_created: ${{ steps.release.outputs['client-react--release_created'] }}
      prs_created: ${{ steps.release.outputs.prs_created }}
      prs: ${{ steps.release.outputs.prs }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Rewrite each release PR's generated changelog section with the curated
  # "## Release Notes" sections authored on the feature PRs it covers.
  # Release-please force-pushes the release branch on every run, so this job
  # reapplies curation right after, every time; nothing is ever lost because
  # the source of truth lives in the feature PR bodies.
  curate-release-notes:
    needs: release-please
    # Also run on manual dispatch even when release-please reports no PR
    # update: it skips updating a release PR whose generated body is
    # unchanged, and dispatch is exactly how notes added after the fact get
    # applied to it.
    if: ${{ needs.release-please.outputs.prs_created == 'true' || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Curate release notes on each release PR
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Run the script from main's copy, whatever the release branch holds.
          cp .github/scripts/curate-release-notes.mjs "$RUNNER_TEMP/curate-release-notes.mjs"
          # Enumerate open release PRs directly rather than from the action's
          # outputs, which omit PRs it found already up to date.
          gh pr list --label "autorelease: pending" --state open \
            --json number,headRefName \
            --jq '.[] | [.number, .headRefName] | @tsv' |
          while IFS=$'\t' read -r number branch; do
            echo "::group::Curating release PR #$number ($branch)"
            git fetch origin "$branch"
            git checkout -B "$branch" "origin/$branch"
            node "$RUNNER_TEMP/curate-release-notes.mjs" --pr "$number"
            if ! git diff --quiet; then
              git add -A
              git commit -m "chore: curate release notes"
              git push origin "HEAD:$branch"
            else
              echo "No changelog changes needed."
            fi
            echo "::endgroup::"
          done

  publish-js:
    needs: release-please
    if: ${{ needs.release-please.outputs.js_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run test -w client-js
      - run: npm run build -w client-js
      - run: npm publish --provenance
        working-directory: client-js

  publish-react:
    needs: release-please
    if: ${{ needs.release-please.outputs.react_release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'
      - run: npm install
      - run: npm run test -w client-js
      - run: npm run test -w client-react
      - run: npm run build -w client-js
      - run: npm run build -w client-react
      - run: npm publish --provenance
        working-directory: client-react
