name: Draft Release Notes

# Has Claude draft (or refresh) the "## Release Notes" section of a PR
# description. The curate-release-notes job of the Release Please workflow
# later copies that section into the release PR's CHANGELOG and the GitHub
# release.
#
# Triggers:
#   - automatically when a same-repo PR is opened or marked ready for review,
#     if its Release Notes section is missing or still holds template
#     placeholders ("- ...")
#   - comment "/release-notes" on a PR to draft or redo it on demand
#   - manually from the Actions tab (workflow_dispatch) with a PR number
#
# Requires the ANTHROPIC_API_KEY repository secret.

on:
  pull_request:
    types: [opened, ready_for_review]
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      pr:
        description: "PR number to draft release notes for"
        required: true

jobs:
  draft:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       !github.event.pull_request.draft &&
       !startsWith(github.event.pull_request.head.ref, 'release-please--') &&
       (!contains(github.event.pull_request.body, '## Release Notes') ||
        contains(github.event.pull_request.body, '- ...'))) ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.pull_request &&
       contains(github.event.comment.body, '/release-notes') &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
    env:
      PR_NUMBER: ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Draft the "## Release Notes" section for pull request #${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }} in ${{ github.repository }}.

            1. Read the PR: `gh pr view ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }} --json title,body` and `gh pr diff ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }}`.
            2. Write release-note bullets for SDK users, following the house style:
               - One bullet per user-facing change, written as full sentences that
                 explain what was added/fixed, how to use it, and any version or
                 compatibility caveats. Include markdown links to docs pages under
                 https://docs.pipecat.ai/api-reference/client/ where they exist.
                 A single commit can produce multiple bullets: a commit that adds a
                 new interface and deprecates the old one gets a Features bullet
                 and a Deprecations bullet, both citing the same commit.
               - Group bullets under "### client-js" and/or "### client-react"
                 (only the packages this PR touches), with "####" headings inside
                 each, chosen from: Features, Changed, Deprecations, Removed,
                 Bug Fixes, Security, Performance Improvements, Reverts,
                 Documentation, Other.
               - Bullets are markdown: wrap every code identifier in backticks —
                 methods (`sendText()`), events and messages (`user-input`), types
                 (`TextType`), fields and options (`input_type`), literal values
                 (`"backchannel"`), and package names (`@pipecat-ai/client-js`).
               - Style example: "Added support for the new RTVI `user-input` event,
                 which reports what the user said or typed back to the client via a
                 new `onUserInput` callback and corresponding `UserInput` event. The
                 event includes an `input_type` which can be `transcription`, `chat`,
                 or `backchannel`."
               - Skip internal refactors, tests, and CI changes. If nothing is
                 user-facing, say so in your reply and do not edit the PR.
            3. Update the PR description with `gh pr edit ${{ github.event.issue.number || github.event.pull_request.number || inputs.pr }} --body-file <file>`:
               replace the existing "## Release Notes" section (everything until the
               next "## " heading) if there is one, otherwise append the section.
               Preserve the rest of the description exactly, but drop any template
               placeholder bullets ("- ...") and HTML comments inside the section
               you write.
          claude_args: |
            --allowedTools "Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr edit:*),Read,Grep,Glob"
