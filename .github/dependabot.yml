version: 2
updates:
  # The actions every workflow pins by commit.
  - package-ecosystem: github-actions
    directory: /
    # Without an explicit prefix Dependabot writes "chore(deps): ...", and
    # .commitlintrc.json only allows package names as scopes. No `include:
    # scope`, so the commits read "ci: bump ...".
    commit-message:
      prefix: ci
    schedule:
      interval: weekly
    # A release that turns out to be compromised is usually caught within
    # days; a week's wait keeps it out of the jobs that publish to npm and
    # hold the app keys.
    cooldown:
      default-days: 7
    # Minor and patch updates in one pull request; each major on its own.
    groups:
      actions:
        update-types: [minor, patch]
